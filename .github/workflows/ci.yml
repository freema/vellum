name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, not "latest": a linter release turns every open PR red
          # without a line of our code changing. v2.13.0 (2026-08-19) does
          # exactly that — its nilness analyzer panics ("unhandled builtin
          # recover") while analyzing a dependency, which reproduces on an
          # untouched main. Bump this deliberately.
          version: v2.12.2
