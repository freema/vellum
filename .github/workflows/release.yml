name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/freema/vellum
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` is what an unpinned `docker pull` gets, so a
            # pre-release tag (v1.13.0-beta.1 — anything with a hyphen)
            # must not move it. The semver patterns above already skip
            # pre-releases; this raw tag did not, so tagging a beta would
            # have shipped unreleased code to everyone tracking latest.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  # The GitHub Release entry, with notes lifted from the tag's CHANGELOG
  # section — keeps /releases in step with the tags (they drifted apart
  # between v1.0.1 and v1.8.0, all created image-only).
  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        run: |
          # A pre-release (1.13.0-beta.1) has no section of its own; it
          # carries the notes of the version it is a candidate for.
          ver="${GITHUB_REF_NAME#v}"
          ver="${ver%%-*}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "_No changelog section found for ${GITHUB_REF_NAME}._" > notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the tag means a pre-release (v1.13.0-beta.1), which
          # must not be presented as the current version on /releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            --verify-tag
